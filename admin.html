    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <link

    <style>
      /* ── 推播管理 Sub-menu ── */
      .admin-nav-group-btn {
        width: 100%; display: flex; align-items: center; gap: 10px;
        padding: 9px 16px; border: none; background: transparent; cursor: pointer;
        font-size: 13px; font-weight: 500; color: #6b7280;
        font-family: 'Noto Sans TC', sans-serif; text-align: left; transition: color .15s;
      }
      .admin-nav-group-btn:hover { color: #6366f1; background: rgba(99,102,241,.04); }
      .admin-nav-group-btn > span { flex: 1; }
      .nav-grp-chevron { font-size: 10px; transition: transform .2s; margin-left: auto; }
      .admin-nav-children { display: none; }
      .admin-nav-group.is-open > .admin-nav-children { display: block; }
      .admin-nav-child { padding-left: 38px !important; font-size: 12px !important; }
      .admin-nav-child:hover { background: rgba(99,102,241,.06) !important; }
      .perm-hidden { display: none !important; }
    </style>
  </head>
