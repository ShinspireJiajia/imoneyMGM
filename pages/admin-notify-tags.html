<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>標籤管理 - 後台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/admin-notify.css" />
  </head>
  <body class="admin" data-notify-page="tags">
  <div class="page-wrap fade-in">

    <div class="page-header">
      <div class="ph-title">
        <h1><i class="fa-solid fa-tags" style="color:#6366f1;margin-right:8px;font-size:18px;"></i>標籤管理</h1>
      </div>
    </div>

    <div class="tag-panel" style="max-width:700px;">
      <div class="tag-panel-head">
        <span class="tag-panel-title"><i class="fa-solid fa-tag" style="color:#6366f1;"></i>標籤清單</span>
        <button class="btn-p" id="btn-new-tag" style="font-size:12px;padding:5px 12px;"><i class="fa-solid fa-plus"></i> 新增標籤</button>
      </div>
      <div id="tag-list-container"></div>
    </div>

  </div><!-- /page-wrap -->


  <!-- Modal: 標籤 CRUD -->
  <div id="modal-tag-edit" class="m-ov" hidden>
    <div class="m-backdrop" data-close="modal-tag-edit"></div>
    <div class="m-panel m-panel--sm" role="dialog">
      <header class="m-head">
        <div class="m-title"><i class="fa-solid fa-tag" style="color:#6366f1;"></i><span id="tag-edit-modal-label">新增標籤</span></div>
        <button class="m-close" data-close="modal-tag-edit"><i class="fa-solid fa-xmark"></i></button>
      </header>
      <div class="m-body">
        <div style="margin-bottom:18px;">
          <div class="cs-label" style="margin-bottom:6px;">標籤名稱</div>
          <input id="tag-edit-name" type="text" maxlength="12" placeholder="例：VIP、高潛力…" class="cf-input" style="font-size:14px;" />
          <div id="tag-edit-name-err" style="color:#ef4444;font-size:12px;margin-top:4px;display:none;">請輸入標籤名稱</div>
        </div>
      </div>
      <footer class="m-foot">
        <button class="m-btn-cancel" data-close="modal-tag-edit">取消</button>
        <button class="m-btn-ok" id="tag-edit-save"><i class="fa-solid fa-check"></i> 儲存</button>
      </footer>
    </div>
  </div>

  <script src="../js/admin-notify.js"></script>
  </body>
</html>
