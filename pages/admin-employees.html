<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>員工帳號管理 - 後台</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/admin-referrers.css" />
    <link rel="stylesheet" href="../css/admin-employees.css" />
  </head>
  <body class="admin">
    <main class="employees-page fade-in page-wrap">

      <div class="page-crumb">會員管理 / 員工帳號管理</div>

      <div class="page-toolbar">
        <div>
          <div class="page-title">員工帳號管理</div>
          
        </div>
      </div>

      <!-- 篩選列 -->
      <section class="filter-bar emp-filter-bar">
        <div class="field">
          <label class="field-label">帳號</label>
          <input class="field-input" id="f-account" type="text" placeholder="例如 @mgm.com" />
        </div>
        <div class="field">
          <label class="field-label">姓名</label>
          <input class="field-input" id="f-name" type="text" placeholder="員工姓名" />
        </div>
        <div class="field">
          <label class="field-label">狀態</label>
          <select class="field-select" id="f-status">
            <option value="all">全部</option>
            <option value="active">啟用</option>
            <option value="inactive">停用</option>
            <option value="resigned">離職員工</option>
          </select>
        </div>
        <button type="button" class="btn btn-primary" id="btn-search">查詢</button>
      </section>

      <!-- 列表 -->
      <section class="list-card">
        <div class="list-head">
          <div>
            <h3>員工清單</h3>
            <div class="list-head-hint">
              每日排程與人員主檔比對，比對不到的員工將自動標記為離職
            </div>
          </div>
          <div class="sync-status">
            <i class="fa-solid fa-rotate"></i>
            最後同步：<span id="last-sync-time">—</span>
          </div>
        </div>

        <div style="overflow-x: auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>帳號</th>
                <th>姓名</th>
                <th>綁定手機</th>
                <th>狀態</th>
                <th>離職時間</th>
                <th>MGM 推薦資格</th>
                <th style="min-width: 220px;">操作</th>
              </tr>
            </thead>
            <tbody id="employees-tbody"></tbody>
          </table>
        </div>

        <div class="pagination-bar">
          <div class="pagination">
            <button class="pg-btn" disabled>«</button>
            <button class="pg-btn pg-active">1</button>
            <button class="pg-btn" disabled>»</button>
          </div>
          <div class="pg-total">共: <span id="emp-pg-total">0</span> 筆</div>
        </div>
      </section>
    </main>

    <!-- ============== 檢視員工詳情 Modal ============== -->
    <div id="emp-view-modal" class="note-modal-bg">
      <div class="note-modal" style="max-width: 720px;">
        <h3>
          <i class="fa-solid fa-id-badge" style="color: var(--color-primary);"></i>員工詳情
          <span class="note-target-wrap">
            <span id="emp-view-target">—</span>
          </span>
        </h3>

        <div class="view-tabs">
          <button type="button" class="view-tab active" data-evtab="info">基本資訊</button>
          <button type="button" class="view-tab" data-evtab="links" id="ev-tab-links">專屬推薦碼</button>
          <button type="button" class="view-tab" data-evtab="cases" id="ev-tab-cases">對應案件</button>
        </div>

        <!-- 基本資訊 -->
        <div class="view-pane" data-evpane="info">
          <div class="view-info-grid">
            <div class="view-info-row"><span class="view-info-label">員工編號</span><span class="view-info-value" id="ev-id">—</span></div>
            <div class="view-info-row"><span class="view-info-label">登入帳號</span><span class="view-info-value" id="ev-account">—</span></div>
            <div class="view-info-row"><span class="view-info-label">姓名</span><span class="view-info-value" id="ev-name">—</span></div>
            <div class="view-info-row"><span class="view-info-label">綁定手機</span><span class="view-info-value" id="ev-phone">—</span></div>
            <div class="view-info-row"><span class="view-info-label">帳號狀態</span><span class="view-info-value" id="ev-status">—</span></div>
            <div class="view-info-row" id="ev-resigned-row" hidden><span class="view-info-label">離職時間</span><span class="view-info-value" id="ev-resigned-at">—</span></div>
            <div class="view-info-row"><span class="view-info-label">MGM 推薦資格</span><span class="view-info-value" id="ev-mgm-joined">—</span></div>
            <div class="view-info-row" id="ev-uid-row" hidden><span class="view-info-label">對應推薦人編號</span><span class="view-info-value" id="ev-uid">—</span></div>
          </div>
        </div>

        <!-- 專屬推薦碼 -->
        <div class="view-pane" data-evpane="links" hidden>
          <div class="view-links-list" id="ev-links-list"></div>
        </div>

        <!-- 對應案件 -->
        <div class="view-pane" data-evpane="cases" hidden>
          <div class="view-cases-list" id="ev-cases-list"></div>
          <p class="view-cases-hint">
            <i class="fa-solid fa-circle-info"></i>
            僅顯示案件申請進度與被推薦人資訊
          </p>
        </div>

        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top: 14px;">
          <button id="btn-emp-view-close" type="button" class="btn btn-outline">關閉</button>
        </div>
      </div>
    </div>

    <script src="../js/admin-employees.js"></script>
  </body>
</html>
