<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>排程推播 - 後台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/admin-notify.css" />
  </head>
  <body class="admin" data-notify-page="schedule">
  <div class="page-wrap fade-in">

    <div class="page-header">
      <div class="ph-title">
        <h1><i class="fa-regular fa-calendar-check" style="color:#6366f1;margin-right:8px;font-size:18px;"></i>排程推播</h1>
      </div>
    </div>

    <div class="log-card">
      <div class="log-card-head">
        <span class="log-card-title"><i class="fa-regular fa-calendar-check" style="color:#6366f1;margin-right:6px;"></i>排程發送列表</span>
        <div style="display:flex;gap:8px;align-items:center;">
          <a class="btn-export-log" id="btn-new-schedule" href="admin-notify-send.html" style="text-decoration:none;"><i class="fa-solid fa-plus"></i> 建立新排程</a>
          <button class="btn-refresh" id="btn-refresh-schedule"><i class="fa-solid fa-rotate-right"></i> 重新整理</button>
        </div>
      </div>

      <!-- ── 篩選列 ── -->
      <div class="log-filter-bar">
        <div class="log-filter-row">
          <div class="log-filter-item">
            <label class="lf-label">狀態</label>
            <select class="lf-select" id="sf-status">
              <option value="">全部狀態</option>
              <option value="pending">待發送</option>
              <option value="sent">已發送</option>
              <option value="cancelled">已取消</option>
            </select>
          </div>
          <div class="log-filter-item">
            <label class="lf-label">排程時間（起）</label>
            <input class="lf-input" type="date" id="sf-date-from" />
          </div>
          <div class="log-filter-item">
            <label class="lf-label">排程時間（訖）</label>
            <input class="lf-input" type="date" id="sf-date-to" />
          </div>
          <div class="log-filter-item lf-item--grow">
            <label class="lf-label">關鍵字</label>
            <input class="lf-input" type="text" id="sf-keyword" placeholder="排程名稱 / 母版名稱 / 訊息內容…" autocomplete="off" />
          </div>
        </div>
        <div class="log-filter-actions">
          <button class="btn-lf-search" id="btn-search-schedule"><i class="fa-solid fa-magnifying-glass"></i> 搜尋</button>
          <button class="btn-lf-clear"  id="btn-clear-schedule"><i class="fa-solid fa-xmark"></i> 清除篩選</button>
        </div>
      </div>

      <div class="log-result-bar" id="schedule-result-info"></div>

      <div style="overflow-x:auto;">
        <table class="log-table">
          <thead>
            <tr>
              <th>排程發送時間</th><th>排程名稱 / 母版</th><th>發送對象</th><th>管道</th><th>建立資訊</th><th>狀態</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="schedule-tbody"></tbody>
        </table>
      </div>

      <div class="pagination" id="schedule-pagination"></div>
    </div>

  </div><!-- /page-wrap -->

  <!-- Modal: 排程明細 -->
  <div id="modal-schedule-detail" class="m-ov" hidden>
    <div class="m-backdrop" data-close="modal-schedule-detail"></div>
    <div class="m-panel m-panel--lg" role="dialog">
      <header class="m-head">
        <div class="m-title"><i class="fa-regular fa-calendar-check" style="color:#6366f1;"></i>排程推播明細</div>
        <button class="m-close" data-close="modal-schedule-detail"><i class="fa-solid fa-xmark"></i></button>
      </header>
      <div class="m-body" id="sch-detail-body"></div>
      <footer class="m-foot">
        <button class="m-btn-ok" data-close="modal-schedule-detail">關閉</button>
      </footer>
    </div>
  </div>

  <script src="../js/admin-notify.js"></script>
  </body>
</html>
