    .logs-table { width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
    .logs-table thead tr { background:var(--admin-table-head-bg); color:var(--admin-table-head-fg); }
    .logs-table th { padding:10px 14px; text-align:left; font-weight:600; white-space:nowrap; }
    .logs-table tbody tr { border-bottom:1px solid var(--color-border-light); transition:background .1s; }
    .logs-table tbody tr:hover { background:var(--admin-row-hover); }
    .logs-table td { padding:9px 14px; vertical-align:middle; white-space:nowrap; }

    .op-badge { display:inline-block; border-radius:5px; padding:2px 8px; font-size:11px; font-weight:600; white-space:nowrap; }
    .op-view   { background:#e0f2fe; color:#0369a1; }
    .op-edit   { background:#dcfce7; color:#15803d; }
    .op-delete { background:#fee2e2; color:#991b1b; }
    .op-exec   { background:#fef3c7; color:#92400e; }
    .op-login  { background:#f3e8ff; color:#6d28d9; }

    .filter-grid-4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; }
    @media (max-width:900px) { .filter-grid-4 { grid-template-columns:1fr 1fr; } }
    @media (max-width:600px) { .filter-grid-4 { grid-template-columns:1fr; } }

  </style>
</head>
<body class="admin">
<main class="page-wrap fade-in">
  <div class="page-crumb">系統管理 / 操作紀錄查詢</div>
  <!-- 篩選 -->
  <section class="filter-card">
    <div class="filter-card-head">
      <button type="button" class="btn-outline btn-sm" id="btn-toggle-filter">
        <i class="fa-solid fa-chevron-up"></i>收合篩選
      </button>
    </div>
    <div class="filter-grid-4" id="filter-grid">
      <div class="field-row">
        <label class="field-label">帳號 (Email)</label>
        <input class="field-input" id="f-email" type="text" placeholder="搜尋帳號" />
      </div>
      <div class="field-row">
        <label class="field-label">紀錄時間（起）</label>
        <input class="field-input" id="f-date-from" type="date" />
      </div>
      <div class="field-row">
        <label class="field-label">紀錄時間（訖）</label>
        <input class="field-input" id="f-date-to" type="date" />
      </div>
      <div class="field-row">
        <label class="field-label">操作模組</label>
        <select class="field-select" id="f-module"><option value="">全部模組</option></select>
      </div>
      <div class="field-row">
        <label class="field-label">操作類型</label>
        <select class="field-select" id="f-action">
          <option value="">全部類型</option>
          <option value="檢視">檢視</option>
          <option value="編輯">編輯</option>
          <option value="刪除">刪除</option>
          <option value="執行">執行</option>
          <option value="登入">登入</option>
          <option value="核款">核款</option>
          <option value="審核">審核</option>
        </select>
      </div>
    </div>
    <div class="filter-card-actions">
      <button type="button" class="btn-outline" id="btn-clear-filter">清除篩選</button>
      <button type="button" class="btn-primary" id="btn-search">查詢</button>
      <button type="button" class="btn-outline" id="btn-export">
        <i class="fa-solid fa-file-csv"></i>匯出 CSV
      </button>
    </div>
  </section>

  <!-- 紀錄清單 -->
  <section class="matrix-card" style="margin-top:0;">
    <div class="matrix-card-head">
      <h3><i class="fa-solid fa-clock-rotate-left"></i>操作紀錄</h3>
      <span id="logs-count" style="font-size:13px;color:var(--color-text-secondary);">共 0 筆</span>
    </div>
    <div style="overflow-x:auto;">
      <table class="logs-table">
        <colgroup>
          <col style="width:5%">
          <col style="width:24%">
          <col style="width:18%">
          <col style="width:13%">
          <col>
        </colgroup>
        <thead>
          <tr>
            <th>#</th>
            <th>帳號</th>
            <th>紀錄時間</th>
            <th>操作模組</th>
            <th>操作功能</th>
          </tr>
        </thead>
        <tbody id="logs-tbody"></tbody>
      </table>
    </div>
    <div class="pagination-bar">
      <div class="pg-size">
        每頁
        <select id="page-size">
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
        筆
      </div>
      <div class="pagination" id="logs-pagination"></div>
      <div class="pg-total">共 <span id="logs-total">0</span> 筆</div>
    </div>
  </section>
</main>

];

const ACTION_CLASS = { '檢視':'op-view', '編輯':'op-edit', '刪除':'op-delete', '執行':'op-exec', '登入':'op-login', '核款':'op-exec', '審核':'op-exec' };

let filtered = [...LOGS];
let currentPage = 1;
let pageSize = 10;

function applyFilter() {
  const email = document.getElementById('f-email').value.trim().toLowerCase();
  const dateFrom = document.getElementById('f-date-from').value;
  const dateTo = document.getElementById('f-date-to').value;
  const module_ = document.getElementById('f-module').value;
  const action = document.getElementById('f-action').value;

  filtered = LOGS.filter(l => {
    if (email && !l.email.toLowerCase().includes(email)) return false;
    if (dateFrom && l.time < dateFrom) return false;
    if (dateTo && l.time > dateTo + ' 23:59:59') return false;
    if (module_ && l.module !== module_) return false;
    if (action && l.action !== action) return false;
    return true;
  });
  currentPage = 1;
  renderTable();
}

function renderTable() {
  const total = filtered.length;
  document.getElementById('logs-total').textContent = total;
  document.getElementById('logs-count').textContent = `共 ${total} 筆`;
  const slice = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);
  const tbody = document.getElementById('logs-tbody');
  if (!slice.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:#9ca3af;">查無紀錄</td></tr>';
    document.getElementById('logs-pagination').innerHTML = '';
    return;
  }
  tbody.innerHTML = slice.map((l, i) => {
    const cls = ACTION_CLASS[l.action] || 'op-view';
    return `<tr>
      <td style="color:#9ca3af;">${(currentPage - 1) * pageSize + i + 1}</td>
      <td style="font-size:12px;">${l.email}</td>
      <td style="font-size:12px;color:var(--color-text-secondary);">${l.time}</td>
      <td><span style="font-size:12px;font-weight:600;">${l.module}</span></td>
      <td style="font-size:12px;">${l.func}</td>
    </tr>`;
  }).join('');
  renderPagination(total);
}

function renderPagination(total) {
  const pages = Math.ceil(total / pageSize);
  const pg = document.getElementById('logs-pagination');
  if (pages <= 1) { pg.innerHTML = ''; return; }
  pg.innerHTML = Array.from({ length: pages }, (_, i) =>
    `<button class="pg-btn${i + 1 === currentPage ? ' active' : ''}" onclick="goPage(${i + 1})">${i + 1}</button>`
  ).join('');
}

function goPage(p) { currentPage = p; renderTable(); }


function exportCsv() {
  const headers = ['紀錄ID','帳號','紀錄時間','操作模組','操作功能','操作對象'];
  const rows = filtered.map(l => [l.id, l.email, l.time, l.module, l.func, l.target]);
  const csv = [headers, ...rows].map(r => r.map(c => `"${c}"`).join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `操作紀錄_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

function init() {
  const fModule = document.getElementById('f-module');
  MODULES_LIST.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    fModule.appendChild(opt);
  });

  applyFilter();

  document.getElementById('btn-search').addEventListener('click', applyFilter);
  document.getElementById('btn-clear-filter').addEventListener('click', () => {
    ['f-email','f-date-from','f-date-to'].forEach(id => document.getElementById(id).value = '');
    ['f-module','f-action'].forEach(id => document.getElementById(id).value = '');
    applyFilter();
  });
  document.getElementById('page-size').addEventListener('change', e => { pageSize = +e.target.value; applyFilter(); });
  document.getElementById('btn-export').addEventListener('click', exportCsv);
  document.getElementById('btn-toggle-filter').addEventListener('click', function() {
    const fg = document.getElementById('filter-grid');
    fg.classList.toggle('collapsed');
    const col = fg.classList.contains('collapsed');
    this.innerHTML = col ? '<i class="fa-solid fa-chevron-down"></i>展開篩選' : '<i class="fa-solid fa-chevron-up"></i>收合篩選';
  });
}
init();
</script>
