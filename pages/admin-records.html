<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>推薦案件管理 - 後台</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/admin-referrers.css" />
    <link rel="stylesheet" href="../css/admin-campaigns.css" />
    <link rel="stylesheet" href="../css/admin-records.css" />
    <link rel="stylesheet" href="../css/memo.css" />
  </head>
  <body class="admin">
    <main class="records-page fade-in page-wrap">
      
      <div class="page-crumb">案件管理 / 推薦案件管理</div>
      <!-- 篩選列 -->
      <section class="filter-card">
        <div class="filter-card-head">
          <button type="button" class="btn-outline btn-sm" id="btn-toggle-advanced">
            <i class="fa-solid fa-chevron-up"></i>收合篩選
          </button>
        </div>
        <div class="filter-grid" id="filter-grid">
          <div class="field-row">
            <label class="field-label">推薦人</label>
            <input class="field-input" id="f-referrer-query" type="text" placeholder="推薦人編號或姓名" />
          </div>
          <div class="field-row">
            <label class="field-label">被推薦人</label>
            <input class="field-input" id="f-referee-query" type="text" placeholder="被推薦人手機號碼或姓名" />
          </div>
          <div class="field-row">
            <label class="field-label">案號</label>
            <input class="field-input" id="f-case-id" type="text" placeholder="例如 M2026052301" />
          </div>
          <div class="field-row">
            <label class="field-label">狀態</label>
            <select class="field-select" id="f-status">
              <option value="all">全部</option>
              <option value="reviewing">案件審核中</option>
              <option value="waiting_accounting">待會計核對</option>
              <option value="accounting_confirmed">會計已核對</option>
              <option value="rewardable">可提領</option>
              <option value="withdrawal_pending">提領申請中</option>
              <option value="disbursing">撥款處理中</option>
              <option value="archived">已歸檔</option>
              <option value="expired">獎金已失效</option>
              <option value="transfer_failed">匯款失敗</option>
              <option value="cash_failed">現場提領失敗</option>
              <option value="invalid">未符合資格</option>
            </select>
          </div>
          <div class="field-row">
            <label class="field-label">推薦人標籤</label>
            <select class="field-select" id="f-tag">
              <option value="">全部</option>
              <option value="會員">會員</option>
              <option value="員工">員工</option>
              <option value="離職員工">離職員工</option>
            </select>
          </div>
          <div class="field-row">
            <label class="field-label">申請日期</label>
            <div class="field-date-range">
              <input class="field-input" id="f-date-from" type="date" />
              <span class="dash">~</span>
              <input class="field-input" id="f-date-to" type="date" />
            </div>
          </div>
        </div>
        <div class="filter-card-actions">
          <button type="button" class="btn-outline" id="btn-clear-filter">清除所有篩選</button>
          <button id="btn-search" type="button" class="btn-primary">
            <i class="fa-solid fa-magnifying-glass"></i>查詢
          </button>
        </div>
      </section>

      <!-- 記錄表格 -->
      <section class="list-card">
        <div class="list-head">
          <h3>案件列表（共 <span id="total-count">0</span> 筆）</h3>
          <button type="button" class="btn btn-outline" id="btn-export-csv" style="font-size:12px;padding:4px 12px;white-space:nowrap;">
            <i class="fa-solid fa-download"></i>匯出資料
          </button>
        </div>

        <div style="overflow-x: auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>案號</th>
                <th>收款類型</th>
                <th>標籤</th>
                <th>會員編號</th>
                <th>姓名</th>
                <th>被推薦人</th>
                <th>被推薦人手機號碼</th>
                <th>狀態</th>
                <th>提領剩餘天數</th>
                <th>對應獎金</th>
                <th style="min-width: 100px;">操作</th>
              </tr>
            </thead>
            <tbody id="records-tbody"></tbody>
          </table>
        </div>

        <div class="pagination-bar">
          <div class="pagination">
            <button class="pg-btn" disabled>«</button>
            <button class="pg-btn pg-active">1</button>
            <button class="pg-btn" disabled>»</button>
          </div>
          <div class="pg-total">共: <span id="rec-pg-total">0</span> 筆</div>
        </div>
      </section>
    </main>

    <!-- ============== 查看案件詳情 Modal ============== -->
    <div id="rec-view-modal" class="rec-modal" hidden>
      <div class="rec-modal-backdrop" data-close></div>
      <div class="rec-modal-panel" role="dialog" aria-modal="true" aria-labelledby="rec-view-title">
        <header class="rec-modal-head">
          <h3 id="rec-view-title">
            <i class="fa-solid fa-circle-info"></i>案件詳情
            <span class="rec-case-id" id="rv-caseid">—</span>
          </h3>
          <button type="button" class="rec-modal-close" data-close aria-label="關閉">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </header>

        <div class="rec-modal-body">
          <section class="rv-section">
            <h4>推薦關係</h4>
            <div class="rv-grid">
              <div class="rv-row"><span class="rv-label">推薦人</span><span class="rv-value" id="rv-referrer">—</span></div>
              <div class="rv-row"><span class="rv-label">會員編號</span><span class="rv-value mono" id="rv-referrer-cid">—</span></div>
              <div class="rv-row"><span class="rv-label">身份</span><span class="rv-value" id="rv-tag">—</span></div>
              <div class="rv-row"><span class="rv-label">諮詢單號</span><a class="rv-value mono rv-ext-link" id="rv-neg" href="#" target="_blank" rel="noopener">—</a></div>
              <div class="rv-row"><span class="rv-label">被推薦人</span><span class="rv-value" id="rv-referee">—</span></div>
              <div class="rv-row"><span class="rv-label">被推薦人手機號碼</span><span class="rv-value mono" id="rv-referee-cid">—</span></div>
              <div class="rv-row"><span class="rv-label">會員編號</span><a class="rv-value mono rv-ext-link" id="rv-customer-id" href="#" target="_blank" rel="noopener">—</a></div>
            </div>
          </section>

          <section class="rv-section">
            <h4>案件資訊</h4>
            <div class="rv-grid">
              <div class="rv-row"><span class="rv-label">案號</span><span class="rv-value mono" id="rv-caseid2">—</span></div>
              <div class="rv-row"><span class="rv-label">專案類型</span><span class="rv-value" id="rv-projects">—</span></div>
              <div class="rv-row"><span class="rv-label">符合活動編號</span><span class="rv-value mono" id="rv-campaign">—</span></div>
              <div class="rv-row"><span class="rv-label">申請日期</span><span class="rv-value mono" id="rv-submit">—</span></div>
              <div class="rv-row"><span class="rv-label">撥款日</span><span class="rv-value mono" id="rv-payout">—</span></div>
              <div class="rv-row"><span class="rv-label">收款單號</span><span class="rv-value mono" style="display:inline-flex;align-items:center;gap:4px;"><a class="rv-ext-link" id="rv-receipt-no" href="#" target="_blank" rel="noopener">—</a><span class="receipt-note-icon" id="rv-receipt-note-icon" hidden></span></span></div>
              <div class="rv-row"><span class="rv-label">應收服務費</span><span class="rv-value mono" id="rv-expected-fee">—</span></div>
              <div class="rv-row"><span class="rv-label">實收服務費</span><span class="rv-value mono" id="rv-actual-fee">—</span></div>
              <div class="rv-row"><span class="rv-label">狀態</span><span class="rv-value" id="rv-status">—</span></div>
              <div class="rv-row" id="rv-row-rewardable-date" hidden><span class="rv-label">可提領日</span><span class="rv-value mono" id="rv-rewardable-date">—</span></div>
              <div class="rv-row" id="rv-row-withdrawal-data" hidden><span class="rv-label">提領資料</span><span class="rv-value" id="rv-withdrawal-data">—</span></div>
              <div class="rv-row rv-row-full"><span class="rv-label">對應獎金</span><span class="rv-value mono rv-amount-emph" id="rv-amount">—</span></div>
            </div>
          </section>

          <section class="rv-section" id="rv-section-reason" hidden>
            <h4><i class="fa-solid fa-triangle-exclamation"></i> 警示代碼說明</h4>
            <div class="rv-reason" id="rv-reason-text"></div>
          </section>

          <section class="rv-section" id="rv-section-conditions" hidden>
            <h4>條件旗標</h4>
            <div id="rv-condition-flags"></div>
          </section>



          <section class="rv-section" id="rv-section-snapshot" hidden>
            <h4>送單時快照參數</h4>
            <div class="rv-snapshot" id="rv-snapshot">—</div>
            <p class="rv-foot">※ 快照於送單當下擷取，後續活動規則調整不影響本案件。</p>
          </section>

          <section class="rv-section">
            <h4><i class="fa-regular fa-note-sticky"></i> 備註</h4>
            <div id="memo-container-record"></div>
          </section>
        </div>

        <footer class="rec-modal-foot">
          <button type="button" class="btn btn-outline" data-close>關閉</button>
        </footer>
      </div>
    </div>

    <script src="../js/memo.js"></script>
    <script src="../js/admin-records.js"></script>
  </body>
</html>
